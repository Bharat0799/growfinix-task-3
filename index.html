<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Player | Professional Video Experience</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="ambient-bg"></div>

    <header class="header">
        <div class="logo-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            NOVA PLAYER
        </div>
        <h1>Professional Video Experience</h1>
        <p class="subtitle">Verified working video sources with playlist support, subtitles, and advanced controls.</p>
    </header>

    <div class="main-container">
        <div class="player-wrapper" id="playerWrapper">
            <!-- Video Element -->
            <video id="videoPlayer" playsinline preload="metadata">
                <track id="subtitleTrack" kind="subtitles" srclang="en" label="English">
            </video>
            
            <div class="gradient-top"></div>
            <div class="gradient-bottom"></div>

            <!-- Loading Spinner -->
            <div class="spinner" id="spinner"></div>

            <!-- Center Action -->
            <div class="center-action visible" id="centerAction">
                <button class="play-btn-large" id="playLargeBtn" aria-label="Play">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>

            <!-- End Screen -->
            <div class="end-screen" id="endScreen">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <div class="end-title">Video Ended</div>
                <div style="display: flex; gap: 12px;">
                    <button class="end-btn secondary" id="replayBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                        Replay
                    </button>
                    <button class="end-btn" id="nextBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                        Next Video
                    </button>
                </div>
            </div>

            <!-- Stats Overlay -->
            <div class="stats-overlay" id="statsOverlay"></div>

            <!-- Subtitles Toggle -->
            <button class="subtitle-toggle" id="subtitleToggle" aria-label="Toggle Subtitles">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="M7 8h10"></path>
                    <path d="M7 12h10"></path>
                    <path d="M7 16h6"></path>
                </svg>
            </button>

            <!-- Quality Selector -->
            <div class="quality-selector" id="qualitySelector">
                <button class="quality-btn" id="qualityBtn">HD</button>
                <div class="quality-menu" id="qualityMenu">
                    <div class="quality-option active" data-quality="auto">Auto</div>
                    <div class="quality-option" data-quality="1080p">1080p</div>
                    <div class="quality-option" data-quality="720p">720p</div>
                    <div class="quality-option" data-quality="480p">480p</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls" id="controls">
                <!-- Progress -->
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-buffer" id="progressBuffer"></div>
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-handle" id="progressHandle"></div>
                    <div class="time-tooltip" id="timeTooltip">0:00</div>
                </div>

                <!-- Control Bar -->
                <div class="control-bar">
                    <div class="ctrl-left">
                        <button class="ctrl-btn" id="playBtn" aria-label="Play">
                            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                        </button>
                        
                        <button class="ctrl-btn" id="skipBack">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7"></path><text x="13" y="15" font-size="8" fill="currentColor" stroke="none">10</text></svg>
                        </button>
                        
                        <button class="ctrl-btn" id="skipFwd">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l7 7-7 7"></path><text x="3" y="15" font-size="8" fill="currentColor" stroke="none">10</text></svg>
                        </button>

                        <div class="volume-group">
                            <button class="ctrl-btn" id="volumeBtn">
                                <svg id="iconVol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                <svg id="iconMute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                            </button>
                            <div class="volume-slider-container">
                                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                            </div>
                        </div>

                        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                    </div>

                    <div class="ctrl-right">
                        <button class="ctrl-btn" id="statsBtn" style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;">Stats</button>

                        <div style="position: relative;">
                            <button class="ctrl-btn" id="settingsBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            </button>
                            <div class="settings-menu" id="settingsMenu">
                                <div class="menu-item" data-speed="0.25"><span>Speed</span><span>0.25x</span></div>
                                <div class="menu-item" data-speed="0.5"><span>Speed</span><span>0.5x</span></div>
                                <div class="menu-item active" data-speed="1"><span>Speed</span><span>Normal</span></div>
                                <div class="menu-item" data-speed="1.25"><span>Speed</span><span>1.25x</span></div>
                                <div class="menu-item" data-speed="1.5"><span>Speed</span><span>1.5x</span></div>
                                <div class="menu-item" data-speed="1.75"><span>Speed</span><span>1.75x</span></div>
                                <div class="menu-item" data-speed="2"><span>Speed</span><span>2x</span></div>
                            </div>
                        </div>

                        <button class="ctrl-btn" id="pipBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><rect x="12" y="9" width="8" height="6" rx="1"></rect></svg>
                        </button>

                        <button class="ctrl-btn" id="fullBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><polyline points="21 15 21 21 15 21"></polyline><polyline points="3 9 3 3 9 3"></polyline></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Playlist Sidebar -->
        <div class="playlist-sidebar">
            <div class="playlist-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                Up Next
            </div>
            <div id="playlistContainer"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
